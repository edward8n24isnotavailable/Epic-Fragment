[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
export_files=PackedStringArray("res://scenes/main.tscn", "res://scenes/player.tscn", "res://scripts/world.gd", "res://scripts/player.gd", "res://scripts/enemy.gd", "res://scripts/hud.gd", "res://scripts/prison_view.gd", "res://scripts/game_data.gd", "res://scripts/game_state.gd")
include_filter="data/*.json"
exclude_filter="legacy/*,node_modules/*,tests/*,tools/*,release/*,build/*,*-check.png,*.md"
export_path="release/EpicFragment.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug="../.tools/godot/templates/windows_debug_x86_64.exe"
custom_template/release="../.tools/godot/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=false
